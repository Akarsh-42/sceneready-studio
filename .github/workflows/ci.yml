name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and audit tooling
        run: python -m pip install -r requirements.txt pip-audit==2.9.0
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: Frontend syntax
        run: node --check static/app.js
      - name: Shell syntax
        run: bash -n scripts/setup.sh scripts/deploy.sh
      - name: Python syntax
        run: python -m compileall -q app scripts tests
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt
